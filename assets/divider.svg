<svg xmlns="http://www.w3.org/2000/svg" width="900" height="22" viewBox="0 0 900 22" role="presentation" aria-hidden="true"><style>svg{--line:#d9d5ca;--accent:#2b59ff;--hi:#ffd23f}@media (prefers-color-scheme:dark){svg{--line:#2a2a30;--accent:#88a2ff}}@media (prefers-reduced-motion:no-preference){.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}.tw2{animation-delay:-1.6s}@keyframes tw{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.35) rotate(45deg)}}}</style><rect x="24" y="10.2" width="380" height="1.6" rx=".8" fill="var(--line)"/><rect x="496" y="10.2" width="380" height="1.6" rx=".8" fill="var(--line)"/><path class="tw" transform="translate(450,11)" d="M0-8 2.2-2.2 8 0 2.2 2.2 0 8-2.2 2.2-8 0-2.2-2.2z" fill="var(--accent)"/><path class="tw tw2" transform="translate(428,11) scale(.55)" d="M0-8 2.2-2.2 8 0 2.2 2.2 0 8-2.2 2.2-8 0-2.2-2.2z" fill="var(--hi)"/><path class="tw tw2" transform="translate(472,11) scale(.55)" d="M0-8 2.2-2.2 8 0 2.2 2.2 0 8-2.2 2.2-8 0-2.2-2.2z" fill="var(--hi)"/></svg>